<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ავტონაწილები</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ავტონაწილები</h1>
    <nav>
      <button class="tab active" data-tab="parts">ნაწილები</button>
      <button class="tab" data-tab="finance">ფინანსები</button>
      <button class="tab" data-tab="admin">ადმინი</button>
    </nav>
  </header>

  <div id="message" class="message" hidden></div>

  <main>
    <!-- ნაწილები -->
    <section id="parts" class="panel">
      <input id="search" type="search" placeholder="ძებნა (კატეგორია, ბრენდი, მანქანა...)">
      <div id="parts-list"></div>
      <p id="parts-empty" class="empty" hidden>ნაწილები ჯერ არ არის დამატებული. დაამატეთ ადმინის გვერდზე.</p>
      <p id="parts-nomatch" class="empty" hidden>ვერაფერი მოიძებნა.</p>
    </section>

    <!-- ფინანსები -->
    <section id="finance" class="panel" hidden>
      <div id="finance-body"></div>
      <p id="finance-empty" class="empty" hidden>გაყიდვები ჯერ არ არის.</p>
    </section>

    <!-- ადმინი -->
    <section id="admin" class="panel" hidden>
      <nav class="subnav">
        <button class="sub active" data-sub="variants">არსებული ვარიანტები</button>
        <button class="sub" data-sub="categories">კატეგორიები და ველები</button>
      </nav>

      <div id="sub-variants" class="subpanel">
        <div id="variant-stats" class="stats"></div>
        <div class="toolbar">
          <input id="variant-search" type="search" placeholder="ძებნა (კატეგორია, ბრენდი, მანქანა...)">
          <button id="toggle-all" class="secondary" hidden>ყველას დაკეცვა</button>
          <button id="new-variant-btn">+ ახალი ვარიანტი</button>
        </div>
        <div id="admin-body"></div>
        <p id="admin-empty" class="empty" hidden>ვარიანტები ჯერ არ არის.</p>
        <p id="admin-nomatch" class="empty" hidden>ვერაფერი მოიძებნა.</p>
      </div>

      <div id="sub-categories" class="subpanel" hidden>
        <p class="hint">კატეგორია არის ნაწილის სახეობა (მაგ. ამორტიზატორი). ველები არის ის, რითაც მისი ვარიანტები განსხვავდება (მაგ. ბრენდი, მანქანა, ძრავი).</p>
        <form id="new-category" class="row">
          <label>კატეგორიის სახელი <input name="name" required></label>
          <label>ველები (გამოყავით მძიმით) <input name="fields" placeholder="ბრენდი, მანქანა, ძრავი"></label>
          <button type="submit">კატეგორიის დამატება</button>
        </form>
        <div id="cat-list"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
